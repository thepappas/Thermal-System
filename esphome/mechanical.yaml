substitutions:
  # Illustrative ROMs only: replace with the addresses of the installed sensors.
  supply_rom: "0xc200000000000428"
  return_rom: "0xf500000000000528"
  mass_in_rom: "0xac00000000000628"
  mass_out_rom: "0x9b00000000000728"

esphome:
  name: thermal-mechanical
  min_version: 2025.10.3

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

ota:
  - platform: esphome
    password: !secret mechanical_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mechanical_mqtt_username
  password: !secret mechanical_mqtt_password
  discovery: false
  log_topic: null
  topic_prefix: hvac/node/mechanical
  birth_message:
    topic: hvac/status/mechanical
    payload: online
    retain: true
  will_message:
    topic: hvac/status/mechanical
    payload: offline
    retain: true
  shutdown_message:
    topic: hvac/status/mechanical
    payload: offline
    retain: true

one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    address: ${supply_rom}
    name: House supply temperature
    state_topic: hvac/house/temp_supply
    retain: false
    update_interval: 30s
  - platform: dallas_temp
    address: ${return_rom}
    name: House return temperature
    state_topic: hvac/house/temp_return
    retain: false
    update_interval: 30s
  - platform: dallas_temp
    address: ${mass_in_rom}
    name: Mass inlet temperature
    state_topic: hvac/mass/temp_in
    retain: false
    update_interval: 30s
  - platform: dallas_temp
    address: ${mass_out_rom}
    name: Mass outlet temperature
    state_topic: hvac/mass/temp_out
    retain: false
    update_interval: 30s

# Local-only, always-off outputs. No MQTT switch or command endpoint is exposed.
switch:
  - platform: gpio
    id: damper_1_disabled
    internal: true
    pin: GPIO16
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: damper_2_disabled
    internal: true
    pin: GPIO17
    restore_mode: ALWAYS_OFF
